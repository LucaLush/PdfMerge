[build-system]
requires = ["setuptools>=61.0"]
backend = "setuptools.build_meta"

[project]
name = "pdf-folder-merger"
version = "1.0.0"
description = "工业级多文件夹 PDF 批量顺序合并工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.4.0",
]

[project.scripts]
pdfmerger = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
